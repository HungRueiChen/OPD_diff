<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPD_diff view harness</title>
<!--
  Renders the real view over a de-identified fixture, so the page can be checked
  in a real browser:
      python tools/make_fixture_js.py
      python test/run_view.py [--edge] [--mode compare|blame] [--select 46,47]
  ?mode=  opens that tab; ?select= picks visits by index for a deterministic shot
  (blame needs exactly one). Without ?select the view chooses its own default.
-->
<style>html,body{height:100%;margin:0}#app{height:100%}</style>
<div id="app"></div>
<pre id="status" hidden></pre>
<script src="../deid/fixtures/index.fixture.js"></script>
<script src="../src/opd_parse.js"></script>
<script src="../src/opd_lineage.js"></script>
<script src="../src/opd_course.js"></script>
<script src="../src/opd_stream.js"></script>
<script src="../src/opd_view.js"></script>
<script>
(function () {
  "use strict";
  var status = document.getElementById("status");
  try {
    var params = new URLSearchParams(location.search);
    var names = Object.keys(window.OPD_FIXTURES || {});
    if (!names.length) throw new Error("no fixtures -- run tools/make_fixture_js.py");
    var name = names[Math.min(names.length - 1, Math.max(0, parseInt(params.get("case") || "0", 10)))];
    var capture = window.OPD_FIXTURES[name];

    var caseName = name.replace(/^opd-capture-/, "case ");
    var app = document.getElementById("app");
    var view = null;

    function applyParams(lineage) {
      var select = params.get("select");
      if (select) {
        var keys = select.split(",")
          .map(function (s) { return parseInt(s, 10); })
          .filter(function (n) { return !isNaN(n) && n >= 0 && n < lineage.nodes.length; })
          .map(function (n) { return lineage.nodes[n].visit.key; });
        if (keys.length) view.select(keys);
      }
      var mode = params.get("mode");
      // "course" is listed explicitly now that it is no longer the default mode:
      // without it, --mode course would silently render Compare instead.
      if (mode === "compare" || mode === "blame" || mode === "course") view.setMode(mode);
    }

    function render(model) {
      var data = {
        caseName: caseName,
        visits: model.visits, entries: model.entries,
        lineage: model.lineage, course: model.course,
        loaded: model.loaded, total: model.total, done: model.done,
      };
      if (view) view.update(data);
      else { view = OPDView.mount(app, data); applyParams(model.lineage); }
      status.textContent = (model.done ? "VIEW OK " : "VIEW STREAMING ") +
        model.loaded + "/" + model.total + " visits, " +
        view.state.selected.size + " selected";
    }

    /* ?stream=<ms> replays the fixture the way a live capture arrives -- list
     * first, then notes newest-first on a timer. That is the only way to see the
     * partially-loaded states offline: against the real HIS they last a minute
     * and cannot be paused, screenshotted or diffed. ?stream=0 replays as fast
     * as the event loop allows. */
    var streamArg = params.get("stream");
    if (streamArg !== null) {
      var gap = Math.max(0, parseInt(streamArg, 10) || 0);
      // ?streamstop=<n> halts after n notes and leaves the page half-read. That
      // state is the one worth looking at: pending rows in the picker, and a
      // blame view that must not yet claim a date for anything. Without it the
      // replay always ends complete and the interesting rendering is never seen.
      var stopAfter = parseInt(params.get("streamstop") || "", 10);
      var limit = (!isNaN(stopAfter) && stopAfter >= 0)
        ? Math.min(stopAfter, capture.notes.length)
        : capture.notes.length;
      var stream = OPDStream.create({ onModel: render });
      stream.setList(capture.list.html);
      var at = 0;
      (function next() {
        if (at >= limit) {
          // finish() only when the whole capture really was replayed. Calling it
          // at a deliberate stop would mark the model done and erase the very
          // half-read state this is here to show. A throttled rebuild is already
          // scheduled, so the last notes still reach the screen on their own.
          if (limit >= capture.notes.length) { applyParams(stream.finish().lineage); return; }
          // ?select= has to be applied again here. At first mount the list had
          // arrived but no notes had, so there were no nodes to resolve an index
          // against and the selection was silently dropped -- which left two
          // visits selected by default, and Blame renders nothing unless exactly
          // one is. Wait out the pending rebuild first so the indices refer to
          // everything that was actually read.
          setTimeout(function () { applyParams(stream.model().lineage); }, 50);
          return;
        }
        stream.addNote(capture.notes[at++]);
        setTimeout(next, gap);
      })();
    } else {
      render(OPDStream.buildModel(capture));
    }
  } catch (e) {
    status.hidden = false;
    status.textContent = "VIEW ERROR\n" + ((e && e.stack) || e);
  }
})();
</script>
